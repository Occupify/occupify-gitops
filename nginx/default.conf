worker_processes auto;

pid /home/occupify/.config/systemd/user/git-ops/nginx/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /home/occupify/.config/systemd/user/git-ops/nginx/logs/access.log;
    error_log /home/occupify/.config/systemd/user/git-ops/nginx/logs/error.log;

    client_body_temp_path /home/occupify/.config/systemd/user/git-ops/nginx/body;
    proxy_temp_path /home/occupify/.config/systemd/user/git-ops/nginx/body;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting: 10 requests / second, burst 25
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream trỏ đến API Gateway (:8080)
    upstream backend_gateway {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream pgadmin_backend {
        server 127.0.0.1:5050;
        keepalive 32;
    }

    log_format api_log
        '$remote_addr '
        'trace_id=$request_id '
        '"$request" '
        'status=$status '
        'request_time=$request_time '
        'upstream_status=$upstream_status '
        'upstream_response_time=$upstream_response_time '
        'body_bytes_sent=$body_bytes_sent '
        'user_agent="$http_user_agent"';

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            limit_req zone=api_limit burst=25 nodelay;

            access_log /home/occupify/.config/systemd/user/git-ops/nginx/logs/prod-access.log api_log;
            error_log /home/occupify/.config/systemd/user/git-ops/nginx/logs/prod-error.log error;

            proxy_pass http://backend_gateway;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}