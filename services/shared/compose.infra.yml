services:
  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    container_name: occupify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - occupify-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: occupify-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - occupify-network

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: occupify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@occupify.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Password123}
      SCRIPT_NAME: /pgadmin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_DISABLE_POSTFIX: 'true'
    ports:
      - "127.0.0.1:5050:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin:U
    networks:
      - occupify-network

volumes:
  rabbitmq_data:
  pgadmin_data:

networks:
  occupify-network:
    external: true
