services:
  postgres-noti:
    image: docker.io/library/postgres:16-alpine
    container_name: occupify-postgres-noti
    restart: unless-stopped
    environment:
      POSTGRES_DB: occupify_noti
      POSTGRES_USER: ${NOTI_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTI_DB_PASSWORD:-postgres}
    ports:
      - "5534:5432"
    volumes:
      - postgres_noti_data:/var/lib/postgresql/data
    networks:
      - occupify-network

volumes:
  postgres_noti_data:

networks:
  occupify-network:
    external: true
