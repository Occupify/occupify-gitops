services:
  postgres-core:
    image: docker.io/library/postgres:16-alpine
    container_name: occupify-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_DB: occupify_core
      POSTGRES_USER: ${CORE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-postgres}
    ports:
      - "5531:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - occupify-network

volumes:
  postgres_core_data:

networks:
  occupify-network:
    external: true
