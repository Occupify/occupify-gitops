services:
  postgres-payment:
    image: docker.io/library/postgres:16-alpine
    container_name: occupify-postgres-payment
    restart: unless-stopped
    env_file:
      - ../../env/payment.env
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  payment:
    image: ghcr.io/occupify/occupify-payment:latest
    container_name: occupify-payment
    restart: on-failure:3
    depends_on:
      - postgres-payment
    env_file:
      - ../../env/payment.env
    ports:
      - "8080:8183"

volumes:
  postgres_payment_data:
