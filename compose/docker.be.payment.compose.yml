services:
  payment:
    image: ghcr.io/${IMAGE_OWNER:-occupify}/occupify-payment:latest
    container_name: occupify-payment
    env_file:
      - ../env/payment.env
    ports:
      - "8183:8183"
    restart: unless-stopped
    networks:
      - occupify-network

networks:
  occupify-network:
    external: true
